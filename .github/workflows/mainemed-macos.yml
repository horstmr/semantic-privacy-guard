name: MaineMed macOS

# O MaineMed migrou para https://github.com/horstmr/mainemed — este workflow
# permanece apenas para a limpeza final da release que ficou neste repositório.
on:
  push:
    branches: ["claude/macos-whisper-packaging-l2xg3u"]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remover release migrada
    runs-on: ubuntu-latest
    steps:
      - name: Delete release e tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete mainemed-v1.0.0 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
